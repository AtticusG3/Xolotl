# Rate limits (gateway v3).
# Limits are per tenant: at most `per_tenant` COUNTED requests in any window of `window_s` seconds.
# A window is half-open: [t, t + window_s). The request that would be the (per_tenant + 1)-th inside a
# window is a VIOLATION. Requests rejected by the gateway (status 429) still count.
# Not counted at all: every request of tenant `ops`, and every request to the path `/health`.
rate_limit:
  per_tenant: 5
  window_s: 10
